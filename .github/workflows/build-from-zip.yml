name: Build APK from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q HeadUnitLauncher.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
          build-root-directory: HeadUnitLauncher
      - name: Build debug APK
        working-directory: HeadUnitLauncher
        run: gradle :app:assembleDebug -PtomtomApiKey="${{ secrets.TOMTOM_API_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: HeadUnitLauncher-debug-apk
          path: HeadUnitLauncher/app/build/outputs/apk/debug/*.apk
