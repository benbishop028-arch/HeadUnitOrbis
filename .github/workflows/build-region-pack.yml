# Builds an offline pack (routing, map, search list) for England and Wales from free OpenStreetMap data, then publishes it as a GitHub release.
# Run it from the Actions tab: Build offline region pack > Run workflow. It takes a long time (hours). When it finishes, the release has all the files.
name: Build offline region pack
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Name of the release to publish the files to (becomes the end of the download address)"
        default: "pack-ew"
      bbox:
        description: "Box cut from Great Britain: west,south,east,north (default is England and Wales)"
        default: "-5.9,49.8,1.9,55.85"
      source_url:
        description: "Optional: a direct link to a Great Britain .osm.pbf, if the automatic sources fail"
        default: ""
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Download the OpenStreetMap extract
        run: |
          mkdir -p data
          BBOX="${{ inputs.bbox }}"
          echo "Cutting a box: $BBOX"
          check() { # prints the size in MB when a link answers with a real file, else nothing
            local h; h=$(curl -sIL -A "Mozilla/5.0" "$1" | tr -d '\r')
            echo "$h" | head -1 | grep -q " 200" || return 1
            echo "$h" | grep -i '^content-length:' | tail -1 | awk '{printf "%d", $2/1048576}'
          }
          get() { echo "Downloading $1"; curl -fL -A "Mozilla/5.0" -o "$2" "$1"; }
          ok=""
          if [ -n "${{ inputs.source_url }}" ]; then get "${{ inputs.source_url }}" data/gb.osm.pbf && ok=1; fi
          if [ -z "$ok" ]; then
            for U in https://download.geofabrik.de/europe/great-britain-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/great_britain.osm.pbf; do
              MB=$(check "$U" || true); echo "${MB:-no}  $U"
              if [ -n "$MB" ] && [ "$MB" -gt 500 ]; then get "$U" data/gb.osm.pbf && ok=1 && break; fi
            done
          fi
          if [ -z "$ok" ]; then
            echo "Great Britain file not available: trying England and Wales separately"
            E=""; W=""
            for U in https://download.geofabrik.de/europe/great-britain/england-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/great_britain/england.osm.pbf; do
              MB=$(check "$U" || true); echo "${MB:-no}  $U"
              if [ -n "$MB" ] && [ "$MB" -gt 300 ]; then E="$U"; break; fi
            done
            for U in https://download.geofabrik.de/europe/great-britain/wales-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/great_britain/wales.osm.pbf; do
              MB=$(check "$U" || true); echo "${MB:-no}  $U"
              if [ -n "$MB" ] && [ "$MB" -gt 30 ]; then W="$U"; break; fi
            done
            if [ -n "$E" ] && [ -n "$W" ]; then
              get "$E" data/england.osm.pbf; get "$W" data/wales.osm.pbf
              sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
              osmium merge data/england.osm.pbf data/wales.osm.pbf -o data/gb.osm.pbf
              rm data/england.osm.pbf data/wales.osm.pbf
              ok=1
            fi
          fi
          if [ -z "$ok" ]; then
            echo "No source for England and Wales answered. Re-run with a direct link in the source_url box."
            exit 1
          fi
          ls -l data
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          osmium extract -b "$BBOX" --strategy=smart -o data/region.osm.pbf data/gb.osm.pbf
          rm data/gb.osm.pbf
          ls -l data
      - name: Build the routing tiles with Valhalla
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
          '
          ls -l data
      - name: Build a search list of streets, shops and places
        run: |
          osmium tags-filter data/region.osm.pbf w/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/railway=station nwr/place -o data/named.osm.pbf --overwrite
          osmium export data/named.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o data/named.geojsonseq --overwrite
          python3 - <<'PY'
          import json
          roads = {"motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","pedestrian","road","motorway_link","trunk_link","primary_link","secondary_link"}
          seen = set(); n = 0
          def mid(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "LineString": p = c[len(c)//2]; return p[1], p[0]
              if g["type"] == "Polygon": p = c[0][0]; return p[1], p[0]
              return None
          with open("data/named.geojsonseq", encoding="utf-8") as f, open("data/places.tsv", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  name = (pr.get("name") or "").replace("\t", " ").strip()
                  if not name or not ft.get("geometry"): continue
                  hw = pr.get("highway")
                  if hw:
                      if hw not in roads: continue
                      kind = "Street"
                  else:
                      kind = None
                      for k in ("place", "amenity", "shop", "tourism", "leisure", "office", "railway"):
                          if pr.get(k): kind = pr[k].replace("_", " ").capitalize(); break
                      if kind is None: continue
                      if kind in ("Yes", "Place of worship") and False: continue
                  m = mid(ft["geometry"])
                  if not m: continue
                  key = (name.lower(), kind, round(m[0], 2), round(m[1], 2))
                  if key in seen: continue
                  seen.add(key)
                  out.write("%s\t%s\t%.5f\t%.5f\n" % (name, kind, m[0], m[1])); n += 1
          print("places written:", n)
          PY
          ls -l data/places.tsv
          rm -f data/named.osm.pbf data/named.geojsonseq
      - name: Build the offline map (planetiler)
        continue-on-error: true
        run: |
          docker run --rm -e JAVA_TOOL_OPTIONS="-Xmx10g" -v "$PWD/data:/data" ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/region.osm.pbf --output=/data/map.pmtiles --download --download_dir=/data/sources \
            --force --maxzoom=14 --fetch-wikidata=false
          ls -l data/map.pmtiles
      - name: Fonts for the map labels
        continue-on-error: true
        run: |
          curl -fL -o fonts-src.zip https://github.com/openmaptiles/fonts/releases/download/v2.0/v2.0.zip
          mkdir -p fsrc fontout
          unzip -q fonts-src.zip -d fsrc
          for f in "Noto Sans Regular" "Noto Sans Bold"; do
            d=$(find fsrc -type d -name "$f" | head -1)
            echo "$f -> $d"
            cp -r "$d" "fontout/$(echo "$f" | tr -d ' ')"
          done
          (cd fontout && zip -qr ../data/fonts.zip .)
          ls -l data/fonts.zip
      - name: Publish everything as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          FILES=""
          for f in tiles.tar admins.sqlite valhalla.json places.tsv map.pmtiles fonts.zip; do [ -f "data/$f" ] && FILES="$FILES data/$f"; done
          ls -l $FILES
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Offline pack for the head unit launcher" 2>/dev/null || true
          gh release upload "$TAG" $FILES --repo "${{ github.repository }}" --clobber
          echo "Download address: https://github.com/${{ github.repository }}/releases/download/$TAG"
