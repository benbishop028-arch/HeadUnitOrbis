# Builds an offline routing pack for ONE region from free OpenStreetMap data (stage 1 test).
# Run it from the Actions tab: choose "Build offline region pack", then Run workflow.
# The result is the download called "region-pack" at the bottom of the finished run.
name: Build offline region pack
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Box to cut out of England: west,south,east,north (default covers Hampshire)"
        default: "-1.96,50.70,-0.70,51.39"
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Download the OpenStreetMap extract
        run: |
          mkdir -p data
          BBOX="${{ inputs.bbox }}"
          echo "Cutting a box: $BBOX"
          CANDIDATES="
          https://download.geofabrik.de/europe/great-britain/england-latest.osm.pbf
          https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
          http://download.geofabrik.de/europe/great-britain/england-latest.osm.pbf
          https://download.openstreetmap.fr/extracts/europe/great_britain/england.osm.pbf
          https://download.openstreetmap.fr/extracts/europe/great_britain.osm.pbf
          https://download.openstreetmap.fr/extracts/europe/great_britain/england/hampshire.osm.pbf
          https://download.bbbike.org/osm/bbbike/Southampton/Southampton.osm.pbf
          https://download.bbbike.org/osm/bbbike/Bournemouth/Bournemouth.osm.pbf
          "
          GOT=""
          for U in $CANDIDATES; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I -A "Mozilla/5.0" "$U")
            echo "$CODE  $U"
            if [ "$CODE" = "200" ] && [ -z "$GOT" ]; then GOT="$U"; fi
          done
          if [ -z "$GOT" ]; then echo "No source answered 200. Send me the lines above."; exit 1; fi
          echo "Using: $GOT"
          curl -fL -A "Mozilla/5.0" -o data/source.osm.pbf "$GOT"
          ls -l data
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          osmium extract -b "$BBOX" --strategy=smart -o data/region.osm.pbf data/source.osm.pbf
          rm data/source.osm.pbf
          ls -l data
      - name: Build the routing tiles with Valhalla
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
          '
          ls -l data
      - name: Build a search list of streets, shops and places
        run: |
          osmium tags-filter data/region.osm.pbf w/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/railway=station nwr/place -o data/named.osm.pbf --overwrite
          osmium export data/named.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o data/named.geojsonseq --overwrite
          python3 - <<'PY'
          import json
          roads = {"motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","pedestrian","road","motorway_link","trunk_link","primary_link","secondary_link"}
          seen = set(); n = 0
          def mid(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "LineString": p = c[len(c)//2]; return p[1], p[0]
              if g["type"] == "Polygon": p = c[0][0]; return p[1], p[0]
              return None
          with open("data/named.geojsonseq", encoding="utf-8") as f, open("data/places.tsv", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  name = (pr.get("name") or "").replace("\t", " ").strip()
                  if not name or not ft.get("geometry"): continue
                  hw = pr.get("highway")
                  if hw:
                      if hw not in roads: continue
                      kind = "Street"
                  else:
                      kind = None
                      for k in ("place", "amenity", "shop", "tourism", "leisure", "office", "railway"):
                          if pr.get(k): kind = pr[k].replace("_", " ").capitalize(); break
                      if kind is None: continue
                      if kind in ("Yes", "Place of worship") and False: continue
                  m = mid(ft["geometry"])
                  if not m: continue
                  key = (name.lower(), kind, round(m[0], 2), round(m[1], 2))
                  if key in seen: continue
                  seen.add(key)
                  out.write("%s\t%s\t%.5f\t%.5f\n" % (name, kind, m[0], m[1])); n += 1
          print("places written:", n)
          PY
          ls -l data/places.tsv
          rm -f data/named.osm.pbf data/named.geojsonseq
      - name: Build the offline map (planetiler)
        continue-on-error: true
        run: |
          docker run --rm -e JAVA_TOOL_OPTIONS="-Xmx6g" -v "$PWD/data:/data" ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/region.osm.pbf --output=/data/map.pmtiles --download --download_dir=/data/sources \
            --force --maxzoom=14 --fetch-wikidata=false
          ls -l data/map.pmtiles
      - name: Fonts for the map labels
        continue-on-error: true
        run: |
          curl -fL -o fonts-src.zip https://github.com/openmaptiles/fonts/releases/download/v2.0/v2.0.zip
          mkdir -p fsrc fontout
          unzip -q fonts-src.zip -d fsrc
          for f in "Noto Sans Regular" "Noto Sans Bold"; do
            d=$(find fsrc -type d -name "$f" | head -1)
            echo "$f -> $d"
            cp -r "$d" "fontout/$(echo "$f" | tr -d ' ')"
          done
          (cd fontout && zip -qr ../data/fonts.zip .)
          ls -l data/fonts.zip
      - uses: actions/upload-artifact@v4
        with:
          name: region-pack
          path: |
            data/tiles.tar
            data/admins.sqlite
            data/valhalla.json
            data/places.tsv
            data/map.pmtiles
            data/fonts.zip
