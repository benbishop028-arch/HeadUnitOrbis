# Builds an offline routing pack for ONE region from free OpenStreetMap data (stage 1 test).
# Run it from the Actions tab: choose "Build offline region pack", then Run workflow.
# The result is the download called "region-pack" at the bottom of the finished run.
name: Build offline region pack
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Geofabrik path of the region, e.g. europe/great-britain/england/hampshire"
        default: "europe/great-britain/england/hampshire"
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Download the OpenStreetMap extract
        run: |
          mkdir -p data
          R="${{ inputs.region }}"
          case "$R" in europe/*) ;; *) R="europe/great-britain/$R" ;; esac
          NAME=$(basename "$R")
          PAGE="https://download.geofabrik.de/$(dirname "$R").html"
          # take the real link from Geofabrik's own page instead of guessing the path
          HREF=$(curl -sL "$PAGE" | grep -o "href=\"[^\"]*$NAME-latest.osm.pbf\"" | head -1 | sed 's/^href="//; s/"$//')
          echo "Page: $PAGE"
          echo "Link found: $HREF"
          URL=$(python3 -c "import sys,urllib.parse as u; print(u.urljoin(sys.argv[1], sys.argv[2]))" "$PAGE" "$HREF")
          echo "Downloading: $URL"
          curl -fL -o data/region.osm.pbf "$URL"
          ls -l data
      - name: Build the routing tiles with Valhalla
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
          '
          ls -l data
      - uses: actions/upload-artifact@v4
        with:
          name: region-pack
          path: |
            data/tiles.tar
            data/admins.sqlite
            data/valhalla.json
